version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: ayvy_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ayvy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/ayvy_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  mysql_data: