server.port=8082

#CONFIG SQL SERVER DATABASE!!!
# Configuracao do SQL Server (producao) //
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ayvy;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:@ITB123456}

# Dialeto para SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Em producao utilize "validate" para nao alterar o schema acidentalmente
# ou "update" para permitir a adicao de novas colunas sem recriar as tabelas
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# E-mail da recuperacao de senha. Defina no ambiente (nao commitar a senha):
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_USERNAME=seu-email@gmail.com
#   SPRING_MAIL_PASSWORD=<senha de app do Gmail>
# Sem SPRING_MAIL_HOST o codigo de recuperacao aparece no console do Spring.
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS da recuperacao de senha (Twilio). Defina no ambiente:
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN e TWILIO_FROM (numero Twilio, ex.: +15551234567)
# Sem essas variaveis o codigo pedido por SMS aparece no console do Spring.
ayvy.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
ayvy.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
ayvy.sms.twilio.from=${TWILIO_FROM:}
